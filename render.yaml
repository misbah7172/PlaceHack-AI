services:
  - type: web
    name: placehack-ai
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_MAX_COMPLETION_TOKENS
        value: "9000"
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_REQUEST_TIMEOUT
        value: "120"
      - key: APP_NAME
        value: PlaceHack AI
      - key: VITE_APP_NAME
        value: PlaceHack AI
